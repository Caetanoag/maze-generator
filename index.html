<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f14;
            --bg-2: #11171f;
            --btn: #6487fb;
            --card-bg: #171d23;
            --input-bg:#1a242f;
            --border: #222b35;
            --text: #f5eeee;
        }
        html {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>

<body>
    <main>
        <h1>Maze Generator</h1>
		
        <section id="menu">
			<fieldset>
				<label for="altura">Altura do grid: 
					<input type="number" id="altura" name="altura" min="2" max="50" value="21">
				</label>
				
				<label for="largura">Largura do grid: 
					<input type="number" id="largura" name="largura" min="2" max="50" value="21">
				</label>
				
                <input type="button" id="submit" name="submit" value="enviar">
			</fieldset>
		</section>
		
        <section id="canvas">
            <h2>Maze</h2>
            <canvas id="maze-canvas"></canvas>
        </section>
	</main>
    <script type="module" src="src/main.js"></script>
</body>

</html>
